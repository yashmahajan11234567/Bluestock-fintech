[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "S110",   # try-except-pass — defensive pattern, intentional
    "BLE001", # blind-except — intentional broad catch with fallback logic
]

[tool.ruff.lint.per-file-ignores]
# Protected files from Days 36-43 — DO NOT MODIFY
"src/analytics/clustering.py" = ["ALL"]
"src/analytics/cluster_profiling.py" = ["ALL"]
"src/api/main.py" = ["ALL"]
"src/api/routers/companies.py" = ["ALL"]
"src/api/routers/screener.py" = ["ALL"]
"src/api/routers/valuation.py" = ["ALL"]
"src/dashboard/utils/db.py" = ["ALL"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
    src/analytics/clustering.py
    | src/analytics/cluster_profiling.py
    | src/api/main.py
    | src/api/routers/companies.py
    | src/api/routers/screener.py
    | src/api/routers/valuation.py
    | src/dashboard/utils/db.py
'''
